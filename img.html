<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Responsiveness</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
        }

        .card {
            width: 30%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: blue;
            border-radius: 2%;
            margin-top: 2%;
        }
        
        .card img{
            object-fit: cover;
            width: 100%;
            height: 40vh;
            border-radius: 2%;
            border-bottom-left-radius: 8%;
            border-bottom-right-radius: 8%;
        }

        .content {
            color: #fff;
            padding: 2%;

        }

        .content h2 {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <!-- <div class="img-card"> -->
                <img class="image" src="copa.png" />
            <!-- </div> -->

            <div class="content">
                <h2>About me</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Vero veritatis accusantium suscipit,
                    perferendis ipsum obcaecati commodi! Qui harum ea architecto, adipisci et cumque quaerat ab. Error
                    modi iure odio nobis.</p>
            </div>
        </div>
    </div>
</body>

</html>
